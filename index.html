<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Métodos Numéricos · Laboratorio Interactivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg-deep: #0a0c15;
    --bg-surface: #11131f;
    --bg-elevated: #181c2c;
    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-medium: rgba(255, 255, 255, 0.1);
    --accent-cyan: #00e0ff;
    --accent-purple: #b77cff;
    --accent-green: #2ee59d;
    --accent-amber: #ffb347;
    --accent-rose: #ff6b8b;
    --accent-pink: #ff8cce;
    --text-primary: #f0f3fa;
    --text-secondary: #9aa3bf;
    --text-muted: #5f6a8a;
    --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* bg grid pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 20% 40%, rgba(0, 224, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* layout */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 2;
  }

  /* header */
  .hero {
    text-align: center;
    padding: 56px 0 40px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 224, 255, 0.08);
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--accent-cyan);
    border: 1px solid rgba(0, 224, 255, 0.25);
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 16px;
  }

  .hero-sub {
    color: var(--text-secondary);
    max-width: 580px;
    margin: 0 auto 32px;
    font-size: 1rem;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
  }

  .stat-item {
    text-align: center;
  }

  .stat-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    color: var(--accent-cyan);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* navegación */
  .nav-strip {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10, 12, 21, 0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 8px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-strip::-webkit-scrollbar {
    display: none;
  }

  .nav-links {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: nowrap;
    min-width: max-content;
  }

  .nav-btn {
    background: transparent;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 40px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .nav-btn.active {
    background: rgba(0, 224, 255, 0.12);
    color: var(--accent-cyan);
    border: 1px solid rgba(0, 224, 255, 0.3);
  }

  .nav-btn:hover:not(.active) {
    background: rgba(255, 255, 255, 0.04);
    color: #fff;
  }

  /* vista principal */
  .view {
    display: none;
    padding: 40px 0 64px;
  }

  .view.active-view {
    display: block;
    animation: fadeInUp 0.35s ease-out;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* grid de tarjetas */
  .units-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    margin-top: 24px;
  }

  .unit-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 20px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .unit-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent-color);
    opacity: 0.8;
  }

  .unit-card:hover {
    border-color: var(--border-medium);
    transform: translateY(-3px);
    background: var(--bg-elevated);
  }

  .unit-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent-color);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .unit-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .preview-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 18px;
  }

  .preview-item {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .preview-item::before {
    content: '▹';
    color: var(--accent-color);
    font-size: 10px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-subtle);
    padding-top: 14px;
    margin-top: 8px;
  }

  .topic-count {
    font-size: 12px;
    background: rgba(255, 255, 255, 0.04);
    padding: 4px 10px;
    border-radius: 30px;
    color: var(--accent-color);
  }

  /* detalle de unidad */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-subtle);
    flex-wrap: wrap;
  }

  .back-btn {
    background: transparent;
    border: 1px solid var(--border-medium);
    padding: 8px 20px;
    border-radius: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }

  .back-btn:hover {
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    border-color: var(--accent-cyan);
  }

  .subtema-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .subtema-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border 0.2s;
  }

  .subtema-card.open {
    border-color: rgba(255, 255, 255, 0.18);
  }

  .subtema-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
    background: rgba(0, 0, 0, 0.2);
  }

  .subtema-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    background: var(--bg-elevated);
    padding: 4px 10px;
    border-radius: 20px;
    color: var(--accent-color);
  }

  .subtema-name {
    flex: 1;
    font-weight: 500;
  }

  .prog-badge {
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 40px;
    background: rgba(46, 229, 157, 0.15);
    border: 1px solid rgba(46, 229, 157, 0.4);
    color: var(--accent-green);
  }

  .chevron {
    font-size: 16px;
    color: var(--text-muted);
    transition: transform 0.25s;
  }

  .subtema-card.open .chevron {
    transform: rotate(180deg);
  }

  .subtema-body {
    display: none;
    padding: 0 20px 20px 20px;
    border-top: 1px solid var(--border-subtle);
  }

  .subtema-card.open .subtema-body {
    display: block;
  }

  /* contenido académico */
  .teoria {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 20px;
  }

  .teoria strong {
    color: var(--text-primary);
  }

  .formula-card {
    background: rgba(0, 224, 255, 0.04);
    border: 1px solid rgba(0, 224, 255, 0.15);
    border-radius: 12px;
    padding: 14px 18px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    margin: 20px 0;
    color: #b3f0ff;
  }

  .widget {
    background: var(--bg-elevated);
    border-radius: var(--radius-sm);
    margin-top: 20px;
    border: 1px solid var(--border-subtle);
    overflow: hidden;
  }

  .widget-header {
    padding: 12px 16px;
    background: rgba(0, 0, 0, 0.3);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent-cyan);
  }

  .code-block {
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    overflow-x: auto;
    background: #0c0f17;
    color: #cbd5ff;
  }

  .input-group {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px 16px;
    background: rgba(0, 0, 0, 0.2);
    border-top: 1px solid var(--border-subtle);
  }

  .field {
    flex: 1;
    min-width: 100px;
  }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-family: monospace;
  }

  .field input {
    width: 100%;
    background: var(--bg-deep);
    border: 1px solid var(--border-subtle);
    padding: 8px 12px;
    border-radius: 8px;
    color: #fff;
    font-family: monospace;
    font-size: 13px;
  }

  .run-btn {
    background: var(--accent-cyan);
    border: none;
    padding: 8px 24px;
    border-radius: 40px;
    font-weight: 600;
    font-family: monospace;
    color: #0a0c15;
    cursor: pointer;
    transition: 0.2s;
    margin: 12px 16px;
  }

  .run-btn:hover {
    opacity: 0.85;
    transform: scale(0.97);
  }

  .output-box {
    background: #0c0f17;
    padding: 12px 16px;
    margin: 0 16px 16px 16px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 13px;
    border-left: 3px solid var(--accent-green);
    color: #c9f0e1;
    white-space: pre-wrap;
  }

  hr {
    border-color: var(--border-subtle);
    margin: 20px 0;
  }

  /* responsive */
  @media (max-width: 760px) {
    .container {
      padding: 0 16px;
    }
    .detail-header {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <div class="hero-tag">⚡ Ingeniería Computacional</div>
    <h1>Métodos<br><span style="background: linear-gradient(135deg, #fff, var(--accent-cyan)); -webkit-background-clip: text; background-clip: text; color: transparent;">Numéricos</span></h1>
    <p class="hero-sub">Unidades, fundamentos y simuladores interactivos para dominar el análisis numérico.</p>
    <div class="stats">
      <div class="stat-item"><div class="stat-number">6</div><div class="stat-label">UNIDADES</div></div>
      <div class="stat-item"><div class="stat-number">28+</div><div class="stat-label">SUBTEMAS</div></div>
      <div class="stat-item"><div class="stat-number">10+</div><div class="stat-label">PROGRAMAS</div></div>
    </div>
  </div>
</div>

<div class="nav-strip">
  <div class="container">
    <div class="nav-links">
      <button class="nav-btn active" onclick="showOverview()">◈ VISIÓN GENERAL</button>
      <button class="nav-btn" onclick="showUnit(1)">U1 · INTRO</button>
      <button class="nav-btn" onclick="showUnit(2)">U2 · ECUACIONES</button>
      <button class="nav-btn" onclick="showUnit(3)">U3 · SISTEMAS</button>
      <button class="nav-btn" onclick="showUnit(4)">U4 · DIFERENCIACIÓN</button>
      <button class="nav-btn" onclick="showUnit(5)">U5 · INTERPOLACIÓN</button>
      <button class="nav-btn" onclick="showUnit(6)">U6 · EDOs</button>
    </div>
  </div>
</div>

<div class="container">
  <!-- ========= VISTA PRINCIPAL ========= -->
  <div id="overview-view" class="view active-view">
    <div class="units-grid" id="unitsGrid"></div>
  </div>

  <!-- ========= UNIDADES (se llenan dinámicamente) ========= -->
  <div id="unit-details"></div>
</div>

<script>
  // --------------------------------------------------------------
  // DATA DEFINITION (CONTENIDO ORIGINAL COMPLETO)
  // --------------------------------------------------------------
  const unitsData = [
    { id: 1, title: "Introducción a los Métodos Numéricos", color: "#00e0ff", topics: 5, preview: ["Importancia", "Cifras significativas", "Errores", "Software", "Métodos iterativos"],
      subtemas: [
        { num: "1.1", name: "Importancia de los métodos numéricos", hasProg: false, content: `<p class="teoria">Los métodos numéricos permiten resolver problemas matemáticos complejos mediante algoritmos computacionales. Se aplican en derivadas, integrales, EDOs, matrices, interpolación y ajuste de curvas. Las etapas incluyen especificación, análisis, programación, verificación y documentación.</p><div style="margin-top:1rem; background:rgba(0,224,255,0.03); border-radius:12px; padding:12px; text-align:center;"><span style="font-family:monospace;">📘 Infografía detallada integrada en el recurso</span></div>` },
        { num: "1.2", name: "Conceptos básicos: precisión, exactitud, sesgo", hasProg: false, content: `<p class="teoria"><strong>Cifras significativas:</strong> dígitos no nulos. <strong>Exactitud:</strong> cercanía al valor real. <strong>Precisión:</strong> cercanía entre mediciones. <strong>Incertidumbre y sesgo:</strong> incertidumbre cuantifica dispersión, sesgo es desviación sistemática.</p>` },
        { num: "1.3", name: "Tipos de errores (redondeo, truncamiento, absoluto, relativo)", hasProg: true, content: `<p class="teoria">Error absoluto = |valor real - aproximado|, error relativo = error absoluto / |valor real|. Redondeo y truncamiento se combinan en error total.</p><div class="widget"><div class="widget-header"><span>📐 Calculadora de Errores</span></div><div class="input-group"><div class="field"><label>Valor real</label><input id="errReal" type="number" value="9.81"></div><div class="field"><label>Aproximado</label><input id="errAprox" type="number" value="9.78"></div></div><div class="input-group"><button class="run-btn" onclick="calcError()">Calcular error</button></div><div class="output-box" id="errOutput">Esperando cálculo...</div></div>` },
        { num: "1.4", name: "Software de cómputo numérico", hasProg: false, content: `<p class="teoria">Netlib, NAG, IMSL, Numerical Recipes, MATLAB y GNU Octave son herramientas esenciales para computación numérica de alto rendimiento.</p>` },
        { num: "1.5", name: "Métodos iterativos", hasProg: false, content: `<p class="teoria">Los métodos iterativos generan aproximaciones sucesivas a partir de un valor inicial. Ideales para problemas grandes (millones de variables).</p>` }
      ] },
    { id: 2, title: "Métodos de Solución de Ecuaciones", color: "#b77cff", topics: 5, preview: ["Intervalo", "Bisección", "Aproximaciones sucesivas", "Interpolación", "Aplicaciones"],
      subtemas: [
        { num: "2.1", name: "Métodos de intervalo", hasProg: false, content: `<p class="teoria">Teorema de Bolzano: función continua en [a,b] con signo opuesto en extremos. Métodos de intervalo garantizan raíz.</p>` },
        { num: "2.2", name: "Método de bisección", hasProg: true, content: `<p class="teoria">Divide el intervalo en mitades y selecciona subintervalo que contiene raíz. Converge linealmente.</p><div class="widget"><div class="widget-header"><span>📐 Bisección: f(x)=x³-x-2</span></div><div class="input-group"><div class="field"><label>a</label><input id="bisA" type="number" value="1"></div><div class="field"><label>b</label><input id="bisB" type="number" value="2"></div></div><button class="run-btn" onclick="runBiseccion()">Ejecutar bisección</button><div class="output-box" id="bisOut">Esperando...</div></div>` },
        { num: "2.3", name: "Aproximaciones sucesivas (punto fijo)", hasProg: true, content: `<p class="teoria">Consiste en reescribir f(x)=0 como x=g(x). Iteración x_{n+1}=g(x_n). Converge si |g'(x)|&lt;1.</p><div class="widget"><div class="widget-header"><span>🔁 Punto fijo √N</span></div><div class="input-group"><div class="field"><label>N (radicando)</label><input id="pfN" type="number" value="2"></div><div class="field"><label>x₀ inicial</label><input id="pfX0" type="number" value="1.5"></div></div><button class="run-btn" onclick="runPuntoFijo()">Iterar</button><div class="output-box" id="pfOut">Resultado</div></div>` },
        { num: "2.4", name: "Métodos de interpolación (secante)", hasProg: false, content: `<p class="teoria">Método de la secante: aproxima derivada por diferencia finita, converge con orden φ ≈ 1.618.</p>` },
        { num: "2.5", name: "Aplicaciones", hasProg: true, content: `<p class="teoria">Interés compuesto, termodinámica, ecuaciones de estado, TIR financiera.</p><div class="widget"><div class="widget-header"><span>💰 Interés compuesto</span></div><div class="input-group"><div class="field"><label>Capital inicial</label><input id="invP" type="number" value="1000"></div><div class="field"><label>Tasa anual %</label><input id="invR" type="number" value="5"></div><div class="field"><label>Años</label><input id="invN" type="number" value="10"></div></div><button class="run-btn" onclick="runInteres()">Calcular</button><div class="output-box" id="invOut">Esperando...</div></div>` }
      ] },
    { id: 3, title: "Sistemas de Ecuaciones", color: "#2ee59d", topics: 4, preview: ["Métodos iterativos", "Sistemas no lineales", "Convergencia", "Aplicaciones"],
      subtemas: [
        { num: "3.1", name: "Métodos iterativos (Jacobi, Gauss-Seidel)", hasProg: true, content: `<p class="teoria">Jacobi y Gauss-Seidel resuelven sistemas lineales grandes. Gauss-Seidel actualiza variables inmediatamente y converge más rápido.</p><div class="widget"><div class="widget-header"><span>⚙️ Gauss-Seidel (2x2)</span></div><div class="input-group"><div class="field"><label>Ecuación 1: 4x + y = 9</label></div><div class="field"><label>Ecuación 2: x + 3y = 7</label></div></div><button class="run-btn" onclick="runGaussSeidel()">Resolver</button><div class="output-box" id="gsOut">Aproximación</div></div>` },
        { num: "3.2", name: "Sistemas no lineales", hasProg: false, content: `<p class="teoria">Sistemas con términos no lineales (x², sin(x), xy). Pueden tener múltiples equilibrios, ciclos límite o caos.</p>` },
        { num: "3.3", name: "Convergencia en sistemas", hasProg: true, content: `<p class="teoria">La convergencia requiere diagonal dominante o matriz simétrica definida positiva. Cota de error y número máximo de iteraciones.</p><div class="widget"><div class="widget-header"><span>🔍 Verificar diagonal dominante</span></div><div class="input-group"><div class="field"><label>|a₁₁|</label><input id="dd11" value="4"></div><div class="field"><label>|a₁₂|</label><input id="dd12" value="1"></div><div class="field"><label>|a₂₁|</label><input id="dd21" value="1"></div><div class="field"><label>|a₂₂|</label><input id="dd22" value="3"></div></div><button class="run-btn" onclick="verificarDiagonal()">Verificar</button><div class="output-box" id="ddOut">Esperando...</div></div>` }
      ] },
    { id: 4, title: "Diferenciación e Integración Numérica", color: "#ffb347", topics: 4, preview: ["Diferenciación", "Integración", "Integración múltiple", "Aplicaciones"],
      subtemas: [
        { num: "4.1", name: "Diferenciación numérica", hasProg: true, content: `<p class="teoria">Fórmulas diferencias finitas: adelante O(h), centrada O(h²). La derivada centrada es más precisa.</p><div class="widget"><div class="widget-header"><span>📈 Derivada centrada de f(x)=x² en x=2</span></div><div class="input-group"><div class="field"><label>h (paso)</label><input id="diffH" type="number" value="0.001"></div></div><button class="run-btn" onclick="runDerivada()">Calcular derivada</button><div class="output-box" id="diffOut">Resultado</div></div>` },
        { num: "4.2", name: "Integración numérica (Simpson, Trapecio)", hasProg: true, content: `<p class="teoria">Regla del trapecio y Simpson 1/3 aproximan integrales definidas. Simpson tiene orden O(h⁴).</p><div class="widget"><div class="widget-header"><span>∫ x² dx [0,2] - Simpson</span></div><div class="input-group"><div class="field"><label>a</label><input id="intA" value="0"></div><div class="field"><label>b</label><input id="intB" value="2"></div><div class="field"><label>n (par)</label><input id="intN" value="100"></div></div><button class="run-btn" onclick="runIntegral()">Calcular</button><div class="output-box" id="intOut">Esperando...</div></div>` }
      ] },
    { id: 5, title: "Interpolación y Ajuste", color: "#ff6b8b", topics: 6, preview: ["Newton", "Lagrange", "Splines", "Regresión", "Mínimos cuadrados"],
      subtemas: [
        { num: "5.1", name: "Polinomio de Newton", hasProg: true, content: `<p class="teoria">Usa diferencias divididas para construir polinomio interpolador, eficiente para añadir nodos.</p><div class="widget"><div class="widget-header"><span>📌 Newton (puntos fijos)</span></div><div class="input-group"><div class="field"><label>Nodos x: 0,1,2,3</label><input id="newX" value="0,1,2,3"></div><div class="field"><label>Nodos y: 1,1,3,7</label><input id="newY" value="1,1,3,7"></div><div class="field"><label>x a evaluar</label><input id="newT" type="number" value="2.5"></div></div><button class="run-btn" onclick="runNewton()">Interpolar</button><div class="output-box" id="newOut">Resultado</div></div>` },
        { num: "5.2", name: "Polinomio de Lagrange", hasProg: true, content: `<p class="teoria">Lagrange explicita cada polinomio base, evita diferencias pero más costoso con muchos puntos.</p><div class="widget"><div class="widget-header"><span>📌 Lagrange (ln(x))</span></div><div class="input-group"><div class="field"><label>Nodos x: 1,2,3,4,5</label><input id="lagX" value="1,2,3,4,5"></div><div class="field"><label>Evaluar en t</label><input id="lagT" type="number" value="1.5"></div><div class="field"><label>Cantidad puntos (2-5)</label><input id="lagN" type="number" value="4"></div></div><button class="run-btn" onclick="runLagrange()">Calcular</button><div class="output-box" id="lagOut">Resultado</div></div>` }
      ] },
    { id: 6, title: "Ecuaciones Diferenciales", color: "#ff8cce", topics: 4, preview: ["Euler", "Runge-Kutta", "Sistemas EDO", "Aplicaciones"],
      subtemas: [
        { num: "6.1", name: "Método de Euler", hasProg: true, content: `<p class="teoria">Euler: y_{n+1}=y_n + h f(x_n,y_n). Es simple pero poco preciso.</p><div class="widget"><div class="widget-header"><span>🧪 Euler dy/dx = y, y(0)=1</span></div><div class="input-group"><div class="field"><label>x final</label><input id="eulerXf" value="1"></div><div class="field"><label>h</label><input id="eulerH" value="0.1"></div></div><button class="run-btn" onclick="runEuler()">Resolver</button><div class="output-box" id="eulerOut">Resultado</div></div>` },
        { num: "6.2", name: "Runge-Kutta 4to orden (RK4)", hasProg: true, content: `<p class="teoria">RK4: k1..k4, error O(h⁴). Preciso y estable.</p><div class="widget"><div class="widget-header"><span>🌀 RK4: dy/dx = -2xy, y(0)=1</span></div><div class="input-group"><div class="field"><label>x final</label><input id="rk4Xf" value="1"></div><div class="field"><label>h</label><input id="rk4H" value="0.1"></div></div><button class="run-btn" onclick="runRK4()">Resolver</button><div class="output-box" id="rk4Out">Resultado</div></div>` }
      ] }
  ];

  // Render vista general
  function renderOverview() {
    const grid = document.getElementById('unitsGrid');
    grid.innerHTML = unitsData.map(unit => `
      <div class="unit-card" style="--accent-color: ${unit.color}" onclick="showUnit(${unit.id})">
        <div class="unit-badge">UNIDAD 0${unit.id}</div>
        <div class="unit-title">${unit.title}</div>
        <div class="preview-list">${unit.preview.map(p => `<div class="preview-item">${p}</div>`).join('')}</div>
        <div class="card-footer"><span class="topic-count">${unit.topics} subtemas</span><span style="color:${unit.color}">→</span></div>
      </div>
    `).join('');
  }

  // Render unidades detalle
  function renderUnitDetails() {
    const container = document.getElementById('unit-details');
    container.innerHTML = unitsData.map(unit => `
      <div class="view" id="unit-${unit.id}">
        <div class="detail-header">
          <button class="back-btn" onclick="showOverview()">← Volver al inicio</button>
          <div><h2 style="color:${unit.color}; margin-bottom:4px;">Unidad ${unit.id}</h2><p style="color:var(--text-secondary);">${unit.title}</p></div>
        </div>
        <div class="subtema-list">
          ${unit.subtemas.map(sub => `
            <div class="subtema-card" style="--accent-color: ${unit.color}" onclick="toggleSubtema(this, event)">
              <div class="subtema-header">
                <span class="subtema-num">${sub.num}</span>
                <span class="subtema-name">${sub.name}</span>
                ${sub.hasProg ? '<span class="prog-badge">CÓDIGO</span>' : ''}
                <span class="chevron">▼</span>
              </div>
              <div class="subtema-body">
                ${sub.content}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  window.toggleSubtema = (card, ev) => {
    if(ev.target.closest('.run-btn')) return;
    card.classList.toggle('open');
  };

  window.showOverview = () => {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
    document.getElementById('overview-view').classList.add('active-view');
    document.querySelectorAll('.nav-btn').forEach((btn,idx) => btn.classList.toggle('active', idx === 0));
  };

  window.showUnit = (id) => {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
    document.getElementById(`unit-${id}`).classList.add('active-view');
    document.querySelectorAll('.nav-btn').forEach((btn,idx) => btn.classList.toggle('active', idx === id));
  };

  // funciones simuladores (CONTENIDO ORIGINAL)
  window.calcError = () => {
    const real = parseFloat(document.getElementById('errReal').value);
    const aprox = parseFloat(document.getElementById('errAprox').value);
    if(isNaN(real) || isNaN(aprox) || real === 0) { document.getElementById('errOutput').innerText = 'Error: valores inválidos'; return; }
    const absErr = Math.abs(real - aprox);
    const relErr = absErr / Math.abs(real);
    const perErr = relErr * 100;
    document.getElementById('errOutput').innerHTML = `Error absoluto = ${absErr.toExponential(5)}<br>Error relativo = ${relErr.toExponential(5)}<br>Error porcentual = ${perErr.toFixed(6)}%`;
  };

  window.runBiseccion = () => {
    let a = parseFloat(document.getElementById('bisA').value);
    let b = parseFloat(document.getElementById('bisB').value);
    const f = x => x*x*x - x - 2;
    if(f(a)*f(b) >= 0) { document.getElementById('bisOut').innerText = 'No hay cambio de signo en el intervalo'; return; }
    let iter=0; let c;
    while((b-a)/2 > 1e-7 && iter<100) { c = (a+b)/2; if(f(c)===0) break; else if(f(a)*f(c)<0) b=c; else a=c; iter++; }
    document.getElementById('bisOut').innerHTML = `Raíz ≈ ${c.toFixed(8)}<br>f(raíz) = ${f(c).toExponential(3)}<br>Iteraciones: ${iter}`;
  };

  window.runPuntoFijo = () => {
    let N = parseFloat(document.getElementById('pfN').value);
    let x = parseFloat(document.getElementById('pfX0').value);
    if(N<=0) { document.getElementById('pfOut').innerText = 'N positivo requerido'; return; }
    for(let i=0;i<50;i++) { let xn = (x + N/x)/2; if(Math.abs(xn-x) < 1e-12) { x=xn; break; } x=xn; }
    document.getElementById('pfOut').innerHTML = `√${N} ≈ ${x.toFixed(10)}<br>Verificación: ${(x*x).toFixed(8)}`;
  };

  window.runInteres = () => {
    let P = parseFloat(document.getElementById('invP').value);
    let r = parseFloat(document.getElementById('invR').value);
    let n = parseFloat(document.getElementById('invN').value);
    let total = P * Math.pow(1 + r/100, n);
    document.getElementById('invOut').innerHTML = `Monto final: $${total.toFixed(2)}<br>Interés ganado: $${(total-P).toFixed(2)}`;
  };

  window.runGaussSeidel = () => {
    let x=0, y=0;
    for(let i=0;i<50;i++) { x = (9 - y)/4; y = (7 - x)/3; }
    document.getElementById('gsOut').innerHTML = `x ≈ ${x.toFixed(6)}<br>y ≈ ${y.toFixed(6)}<br>4x+y = ${(4*x+y).toFixed(6)} (≈9)`;
  };

  window.verificarDiagonal = () => {
    const a11 = Math.abs(parseFloat(document.getElementById('dd11').value));
    const a12 = Math.abs(parseFloat(document.getElementById('dd12').value));
    const a21 = Math.abs(parseFloat(document.getElementById('dd21').value));
    const a22 = Math.abs(parseFloat(document.getElementById('dd22').value));
    const dom1 = a11 > a12, dom2 = a22 > a21;
    document.getElementById('ddOut').innerHTML = `Fila1: |${a11}| > |${a12}| → ${dom1?'✓':'✗'}<br>Fila2: |${a22}| > |${a21}| → ${dom2?'✓':'✗'}<br>${dom1&&dom2?'✅ Diagonal dominante → convergencia garantizada':'⚠️ Puede no converger'}`;
  };

  window.runDerivada = () => {
    let h = parseFloat(document.getElementById('diffH').value);
    let x=2; let exact = 2*x;
    let der = ( (x+h)*(x+h) - (x-h)*(x-h) ) / (2*h);
    document.getElementById('diffOut').innerHTML = `f'(2) numérica = ${der.toFixed(8)}<br>Exacto = ${exact}<br>Error = ${Math.abs(der-exact).toExponential(3)}`;
  };

  window.runIntegral = () => {
    let a = parseFloat(document.getElementById('intA').value);
    let b = parseFloat(document.getElementById('intB').value);
    let n = parseInt(document.getElementById('intN').value);
    if(n%2!==0) n++;
    let h = (b-a)/n;
    let sum = (a*a + b*b);
    for(let i=1;i<n;i++) { let xi = a + i*h; let val = xi*xi; sum += (i%2===0 ? 2 : 4) * val; }
    let integral = sum * h / 3.0;
    let exact = (b*b*b - a*a*a)/3;
    document.getElementById('intOut').innerHTML = `∫ x² dx ≈ ${integral.toFixed(8)}<br>Exacto = ${exact}<br>Error = ${Math.abs(integral-exact).toExponential(4)}`;
  };

  window.runNewton = () => {
    const xs = document.getElementById('newX').value.split(',').map(Number);
    const ys = document.getElementById('newY').value.split(',').map(Number);
    let t = parseFloat(document.getElementById('newT').value);
    if(xs.length !== ys.length || xs.some(isNaN)) { document.getElementById('newOut').innerText = 'Formato incorrecto'; return; }
    let n = xs.length;
    let coef = [...ys];
    for(let j=1;j<n;j++) for(let i=n-1;i>=j;i--) coef[i] = (coef[i] - coef[i-1])/(xs[i] - xs[i-j]);
    let res = coef[n-1];
    for(let i=n-2;i>=0;i--) res = res*(t - xs[i]) + coef[i];
    document.getElementById('newOut').innerHTML = `P(${t}) ≈ ${res.toFixed(8)}`;
  };

  window.runLagrange = () => {
    const xs = document.getElementById('lagX').value.split(',').map(Number);
    let t = parseFloat(document.getElementById('lagT').value);
    let m = parseInt(document.getElementById('lagN').value);
    if(m<2 || m>xs.length) { document.getElementById('lagOut').innerText = 'Cantidad de puntos inválida'; return; }
    let useX = xs.slice(0,m);
    let useY = useX.map(x => Math.log(x));
    let res = 0;
    for(let i=0;i<m;i++) { let Li=1; for(let j=0;j<m;j++) if(i!==j) Li *= (t - useX[j])/(useX[i]-useX[j]); res += useY[i]*Li; }
    let exact = Math.log(t);
    document.getElementById('lagOut').innerHTML = `Lagrange ln(${t}) ≈ ${res.toFixed(8)}<br>Exacto = ${exact.toFixed(8)}<br>Error = ${Math.abs(res-exact).toExponential(4)}`;
  };

  window.runEuler = () => {
    let xf = parseFloat(document.getElementById('eulerXf').value);
    let h = parseFloat(document.getElementById('eulerH').value);
    let x=0, y=1;
    while(x < xf - 1e-12) { y += h*y; x+=h; }
    let exact = Math.exp(xf);
    document.getElementById('eulerOut').innerHTML = `Euler: y(${xf}) ≈ ${y.toFixed(8)}<br>Exacto e^${xf} = ${exact.toFixed(8)}<br>Error = ${Math.abs(y-exact).toExponential(4)}`;
  };

  window.runRK4 = () => {
    let xf = parseFloat(document.getElementById('rk4Xf').value);
    let h = parseFloat(document.getElementById('rk4H').value);
    let x=0, y=1;
    const f = (x,y) => -2*x*y;
    while(x < xf - 1e-12) {
      let k1 = h*f(x,y);
      let k2 = h*f(x+h/2, y+k1/2);
      let k3 = h*f(x+h/2, y+k2/2);
      let k4 = h*f(x+h, y+k3);
      y += (k1+2*k2+2*k3+k4)/6;
      x += h;
    }
    let exact = Math.exp(-xf*xf);
    document.getElementById('rk4Out').innerHTML = `RK4: y(${xf}) ≈ ${y.toFixed(10)}<br>Exacto e^(-${xf}²) = ${exact.toFixed(10)}<br>Error = ${Math.abs(y-exact).toExponential(4)}`;
  };

  // init
  renderOverview();
  renderUnitDetails();
  showOverview();
</script>
</body>
</html>
